# SonarQube Cloud project identification - see AGENTS.md for the token convention:
# the token is never stored here, it reaches the scanner as SONAR_TOKEN from the
# GitHub Actions secret (see .github/workflows/sonarcloud.yml).
sonar.projectKey=KishoreMuruganantham_hexaware-training-journal
sonar.organization=kishoremuruganantham
sonar.projectName=Hexaware Training Journal
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.java.binaries=out,out-fund
sonar.exclusions=**/out/**,**/out-fund/**,**/node_modules/**,**/dist/**,lib/**,.idea/**,**/*.iml,**/*.jar,**/*.mwb
